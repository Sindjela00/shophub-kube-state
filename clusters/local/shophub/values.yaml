# Overrides on top of the chart's own defaults (see
# shophub-helm-charts/charts/shophub/values.yaml for what those already are).

database:
  # Real connection string is never committed here. Create the secret out-of-band first:
  #   kubectl create secret generic shophub-database -n shophub \
  #     --from-literal=ConnectionString="Host=...;Database=...;Username=...;Password=..."
  existingSecret: shophub-database

jwt:
  # Same reasoning as database.existingSecret above.
  #   kubectl create secret generic shophub-jwt -n shophub \
  #     --from-literal=SigningKey=<a real random key>
  existingSecret: shophub-jwt

kubernetes:
  # Docker Desktop's Kubernetes maps every Service's NodePort onto the host's own loopback —
  # confirmed live, not assumed. ShopSiteUrlService uses this to build a shop's "Open site" URL.
  externalHost: localhost

discord:
  # Public (not secret) — the bot application's Discord client id, baked into every shop
  # owner's invite link. Left empty until there's a real Discord application to point at; the
  # onboarding endpoints work either way, an empty clientId just makes an unusable invite URL.
  clientId: ""
  # This chart owns the bot token/guild ID now (shop-operator's own DiscordChannelReconciler
  # reads this same Secret live, cross-namespace — see its values.yaml's discord section). Real
  # values are never committed here, same reasoning as database/jwt above:
  #   kubectl create secret generic shophub-discord -n shophub \
  #     --from-literal=DISCORD_BOT_TOKEN=<token> --from-literal=DISCORD_GUILD_ID=<guild-id>
  existingSecret: shophub-discord

grafana:
  # In-cluster Grafana Service DNS name — <kube-prometheus-stack release name>-grafana, in
  # this release's own namespace. No public route exists (see kube-prometheus-stack.grafana
  # below); shophub-app's /grafana-proxy route is the only way in.
  baseUrl: "http://shophub-grafana.shophub.svc.cluster.local"
  # Credentials from the one-time org/service-account bootstrap — see BOOTSTRAP.md. Real
  # values are never committed here, same reasoning as database/jwt above:
  #   kubectl create secret generic shophub-grafana-provisioning -n shophub \
  #     --from-literal=AdminUser=admin \
  #     --from-literal=AdminPassword=<the real admin password> \
  #     --from-literal=ServiceAccountToken=<the "ShopHub Users" org service account token>
  existingSecret: shophub-grafana-provisioning

# kube-prometheus-stack.enabled is left unset (chart default: true).
#
# Cluster-level dashboards and alert rules (the "Observability: cluster-level dashboard" and
# "... cluster-level alert rules" issues) aren't hand-built here — kube-prometheus-stack
# ships them out of the box, on by default (grafana.defaultDashboardsEnabled,
# defaultRules.create), and reinventing well-established kubernetes-mixin dashboards/rules
# would just be a worse copy of what's already there. Concretely, out of the box this already
# provides:
#   - Dashboards: "Kubernetes / Compute Resources / Cluster" and ".../Node (Pods)" (CPU, RAM,
#     filesystem), "Node Exporter / Nodes" and ".../USE Method" (CPU, RAM, filesystem, network
#     per node) — verified present via Grafana's own dashboard search API after a real install,
#     not just assumed from the chart's docs.
#   - Alert rules: the `node` and `kubernetesResources` default rule groups (NodeFilesystem-
#     AlmostOutOfSpace, NodeMemoryHighUtilization, KubeCPUOvercommit, KubeMemoryOvercommit,
#     KubeNodeNotReady, KubeNodeUnreachable, etc.) — exactly "resource exhaustion, node health"
#     per that issue's own wording. defaultRules.rules.* all default to true; nothing to
#     enable here.
#
# What *is* overridden below is sizing — the chart's own defaults assume enough headroom for
# a real cluster, which a single-node local dev cluster doesn't have.
kube-prometheus-stack:
  # Without this, kube_pod_labels carries no label_* dimensions at all (confirmed empty against
  # the real /metrics output) — the per-shop dashboard's CPU/Memory/Disk panels join
  # container_*_usage metrics against kube_pod_labels{label_app_kubernetes_io_instance="$shop"}
  # to scope them to one shop's pods, and that join silently returns nothing without this.
  kube-state-metrics:
    metricLabelsAllowlist:
      - "pods=[app.kubernetes.io/instance,app.kubernetes.io/name]"

  prometheus:
    prometheusSpec:
      retention: 6h
      resources:
        requests:
          cpu: 100m
          memory: 400Mi

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi

  grafana:
    # NOT ephemeral, on purpose — unlike dashboards/rules (which really are all provisioned
    # from the chart on every install, and would be fine to lose), Grafana's own sqlite/org/user
    # database also lives on this volume, and that database is NOT reprovisionable: it's what
    # holds the "ShopHub Users" org (org 2) that the startup bootstrap creates via a one-time
    # Grafana API call (BOOTSTRAP.md step 5 / dev-env/start-environment.sh), plus every
    # per-shop folder/dashboard/permission shophub-app's GrafanaProvisioningService creates
    # under it afterwards. With `enabled: false` (emptyDir), ANY pod restart — not just a
    # fresh install — wiped that database, so org 2 stopped existing while the
    # `shophub-grafana-datasource-org2` ConfigMap below (before it was removed, see the
    # extraManifests comment) still unconditionally provisioned a datasource into org 2 on
    # every boot; Grafana's provisioning is fail-fast (no supported way to make one bad entry
    # non-fatal — see that comment), so the whole process crash-looped
    # (`org.notFound: failed to get org by ID: 2`) until someone manually deleted the
    # ConfigMap, let Grafana come up clean, and redid the org bootstrap by hand. A real PVC
    # fixes that: org 2 and everything under it now survives node drains, OOM kills, image
    # updates, and routine `kubectl rollout restart`, so only the very first install still
    # needs the one-time bootstrap. No storageClassName pinned — nothing else in this repo
    # pins one either (Prometheus's own storageSpec is left at the chart default too), so this
    # rides Docker Desktop's (or whichever local distro's) default StorageClass same as
    # everything else here. 1Gi is generous for a handful of orgs/users/service-accounts;
    # dashboards/folders/permissions are comparatively tiny rows, not blobs.
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

    # Access control (spec 4.1: "only maintainers who maintain the applications have access
    # to Grafana; ShopHub users have no access to the Grafana dashboard"). Both settings below
    # already match the chart's own defaults — pinned explicitly here rather than left
    # implicit, since access control is exactly the kind of thing that shouldn't silently
    # change if an upstream chart default ever does.
    #
    # No Ingress (ingress.enabled: false, chart default) means Grafana has no route reachable
    # from outside the cluster at all — the only way in today is `kubectl port-forward`, which
    # requires cluster access. ShopHub users only ever interact with the shophub/shophub-shop
    # apps' own APIs (separate auth system entirely — a ShopHub JWT means nothing to Grafana,
    # there's no shared identity provider), so "maintainers only" and "ShopHub users have no
    # access" both hold by construction, not by anything actively blocking a ShopHub user
    # specifically. Verified for real: an unauthenticated request to Grafana's API is rejected
    # (401), and the admin credential is only readable via `kubectl get secret` (cluster
    # access required) — see this PR's description.
    ingress:
      enabled: false
    grafana.ini:
      auth.anonymous:
        enabled: false

      # The "Optional" half of spec 4.1 — letting a ShopHub user reach *only* their own shop's
      # Grafana dashboard. The identity bridge lives in shophub-app (GrafanaProvisioningService
      # + the /grafana-proxy route, [auth.proxy]'s trusted counterpart) — this repo's job is
      # just the Grafana-side config that trusts it and serves correctly from a sub-path:
      #   - auth.proxy: Grafana signs a request in as whatever email arrives in the
      #     X-WEBAUTH-USER header, auto-creating that Grafana user on first sight
      #     (auto_sign_up). Safe *only* because nothing but shophub-app's own backend can ever
      #     reach Grafana to set that header — no public Ingress exists (above), so there's no
      #     path for anyone else to forge it.
      #   - server.root_url / serve_from_sub_path: shophub-app mounts the proxy at a fixed
      #     /grafana-proxy prefix (not a per-shop path — which shop(s) a viewer can actually
      #     see is enforced by Grafana's own per-folder permissions, provisioned per shop by
      #     GrafanaProvisioningService, not by anything in the proxy route itself). Grafana
      #     needs to know about that prefix to generate correct asset/API links.
      #
      # Verified against a real cluster, through the actual shophub-app backend rather than
      # hitting Grafana directly: registered a user, created a shop (provisions a folder +
      # single-shop dashboard + owner-only folder permission in the dedicated "ShopHub Users"
      # org), fetched GET /api/shop-sites/{id}/dashboard-link, and opened the URL it returned —
      # got a real 200 with the Grafana dashboard shell, `<base href="/grafana-proxy/">`
      # confirming the sub-path config took effect, for a *brand-new* Grafana account that had
      # never logged in before. Caught two real bugs doing this the honest way instead of just
      # wiring up config and assuming: Grafana dashboard uids cap at 40 characters (a naive
      # "{shop}-overview" scheme went over); and a dashboard URL's `?orgId=` query param does
      # *not* auto-switch a multi-org viewer's active org (confirmed: a fresh user got a 404
      # fetching a dashboard in an org they were a member of but not currently "in") — the
      # dashboard-link endpoint switches the owner's active org server-side, authenticated as
      # them via the same X-WEBAUTH-USER trust, before ever handing back a URL.
      server:
        root_url: "https://shophub.example.com/grafana-proxy/"
        serve_from_sub_path: true
      "auth.proxy":
        enabled: true
        header_name: X-WEBAUTH-USER
        header_property: username
        auto_sign_up: true
        sync_ttl: 60

    # The per-shop dashboard ("Observability: per-shop Grafana dashboard"): one dashboard,
    # templated by a $shop variable populated from live Prometheus data (kube_pod_labels),
    # rather than one literal dashboard file generated per shop — functionally the same "pick
    # a shop, see its panels" outcome, without needing anything to regenerate dashboard JSON as
    # shops come and go. Picked up automatically by the sidecar enabled below.
    dashboards:
      shophub:
        shophub-shop:
          json: |
            {
              "uid": "shophub-shop",
              "title": "ShopHub / Per-Shop Overview",
              "tags": ["shophub"],
              "timezone": "browser",
              "schemaVersion": 39,
              "version": 1,
              "refresh": "30s",
              "time": { "from": "now-24h", "to": "now" },
              "templating": {
                "list": [
                  {
                    "name": "shop",
                    "type": "query",
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "query": "label_values(kube_pod_labels{namespace=\"shops\"}, label_app_kubernetes_io_instance)",
                    "refresh": 2,
                    "includeAll": false,
                    "multi": false,
                    "sort": 1
                  }
                ]
              },
              "panels": [
                {
                  "id": 1, "type": "timeseries", "title": "CPU Usage",
                  "gridPos": { "x": 0, "y": 0, "w": 6, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"shops\"}[5m]) * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "cores"
                    }
                  ]
                },
                {
                  "id": 2, "type": "timeseries", "title": "Memory Usage",
                  "gridPos": { "x": 6, "y": 0, "w": 6, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(container_memory_working_set_bytes{namespace=\"shops\"} * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "working set"
                    }
                  ]
                },
                {
                  "id": 3, "type": "timeseries", "title": "Disk I/O",
                  "gridPos": { "x": 12, "y": 0, "w": 6, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(rate(container_fs_reads_bytes_total{namespace=\"shops\"}[5m]) * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "read"
                    },
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(rate(container_fs_writes_bytes_total{namespace=\"shops\"}[5m]) * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "write"
                    }
                  ]
                },
                {
                  "id": 4, "type": "timeseries", "title": "Network I/O",
                  "gridPos": { "x": 18, "y": 0, "w": 6, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"shops\"}[5m]) * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "receive"
                    },
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"shops\"}[5m]) * on(namespace,pod) group_left() kube_pod_labels{namespace=\"shops\", label_app_kubernetes_io_instance=\"$shop\"})",
                      "legendFormat": "transmit"
                    }
                  ]
                },
                {
                  "id": 5, "type": "stat", "title": "Total Requests (24h)",
                  "gridPos": { "x": 0, "y": 8, "w": 4, "h": 4 },
                  "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(increase({\"http.server.request.duration_seconds_count\", namespace=\"shops\", service=\"$shop\"}[24h]))"
                    }
                  ]
                },
                {
                  "id": 6, "type": "stat", "title": "Successful Requests (24h)",
                  "gridPos": { "x": 4, "y": 8, "w": 4, "h": 4 },
                  "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(increase({\"http.server.request.duration_seconds_count\", namespace=\"shops\", service=\"$shop\", \"http.response.status_code\"=~\"2..\"}[24h]))"
                    }
                  ]
                },
                {
                  "id": 7, "type": "stat", "title": "Failed Requests (24h)",
                  "gridPos": { "x": 8, "y": 8, "w": 4, "h": 4 },
                  "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(increase({\"http.server.request.duration_seconds_count\", namespace=\"shops\", service=\"$shop\", \"http.response.status_code\"=~\"4..|5..\"}[24h]))"
                    }
                  ]
                },
                {
                  "id": 8, "type": "stat", "title": "Unique Visitors Today",
                  "gridPos": { "x": 12, "y": 8, "w": 4, "h": 4 },
                  "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "max({\"http.traffic.unique_visitors_today\", namespace=\"shops\", service=\"$shop\"})"
                    }
                  ]
                },
                {
                  "id": 9, "type": "stat", "title": "Total Traffic (24h)",
                  "gridPos": { "x": 16, "y": 8, "w": 8, "h": 4 },
                  "fieldConfig": { "defaults": { "unit": "decgbytes" }, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum(increase({\"http.traffic.request_bytes_total\", namespace=\"shops\", service=\"$shop\"}[24h]) + increase({\"http.traffic.response_bytes_total\", namespace=\"shops\", service=\"$shop\"}[24h])) / 1e9"
                    }
                  ]
                },
                {
                  "id": 10, "type": "table", "title": "404s by Endpoint (24h)",
                  "gridPos": { "x": 0, "y": 12, "w": 24, "h": 8 },
                  "fieldConfig": { "defaults": {}, "overrides": [] },
                  "targets": [
                    {
                      "datasource": { "type": "prometheus", "uid": "prometheus" },
                      "expr": "sum by (\"http.route\") (increase({\"http.server.request.duration_seconds_count\", namespace=\"shops\", service=\"$shop\", \"http.response.status_code\"=\"404\"}[24h]))",
                      "format": "table",
                      "instant": true
                    }
                  ]
                }
              ]
            }

  # Docker Desktop's Kubernetes VM doesn't mark its root filesystem mount "shared"/"rslave",
  # which node-exporter's default HostToContainer propagation requires — without this, every
  # node-exporter pod CrashLoopBackOffs with "path / is mounted on / but it is not a shared or
  # slave mount" (hit this for real bringing the stack up). minikube/kind/k3s and real cluster
  # nodes don't have this problem; this override is specifically for docker-desktop
  # (cluster.yaml's distribution) and only affects the filesystem-usage metrics node-exporter
  # reads from the host's root mount — CPU/RAM/network (from /proc, /sys) are unaffected.
  prometheus-node-exporter:
    hostRootFsMount:
      mountPropagation: None

  # --- Per-shop observability ("Observability: per-shop Grafana dashboard" / "... alerting") ---
  #
  # Every Shop app is its own Deployment+Service in the `shops` namespace (shophub-shop-operator's
  # Shop controller), named after the owning Shop CR (spec.name is the display name; the CR's own
  # metadata.name — e.g. "shop-<uuid>" — is what actually labels/names the Deployment, Service,
  # and pods: `app.kubernetes.io/instance: <shop CR name>`, Service name == Deployment name ==
  # that same CR name). The ServiceMonitor below scrapes every shop's `/metrics` through that one
  # shared `app.kubernetes.io/name: shophub-shop` selector, so Prometheus discovers new shops
  # automatically — no per-shop config needed here. It's placed under `extraManifests` (not the
  # shop-operator chart) so it only ever gets created once the ServiceMonitor CRD actually exists
  # (this release brings it); shop-operator installs first per BOOTSTRAP.md and has no dependency
  # on kube-prometheus-stack being present at all.
  extraManifests:
    # Grafana datasources are per-org, and kube-prometheus-stack's own datasource provisioning
    # (the "shophub-kube-prometheus-st-grafana-datasource" ConfigMap it generates) targets only
    # the default org (org 1) — it has no orgId field at all. Every per-shop dashboard
    # (shophub-app's GrafanaProvisioningService) lives in org 2 ("ShopHub Users") instead, since
    # it's created there via an org-scoped service account — so org 2 needs its own "Prometheus"
    # / "Alertmanager" datasources (same uids/URLs as the org-1 ConfigMap, just with orgId: 2
    # added) or every panel in every per-shop dashboard fails with "Datasource Prometheus not
    # found", confirmed for real.
    #
    # This USED to be a static `shophub-grafana-datasource-org2` ConfigMap here, picked up by
    # the chart's file-provisioning sidecar (grafana_datasource: "1" label) — removed on
    # purpose, not an oversight. Org 2 itself only exists once the startup bootstrap creates it
    # via a one-time Grafana API call (BOOTSTRAP.md step 5 / dev-env/start-environment.sh),
    # *after* confirming Grafana is up and healthy — but a static ConfigMap is live from
    # Grafana's very first boot, before that bootstrap can possibly have run. Grafana's file
    # provisioning validates the target org exists and is fail-fast: an unresolvable orgId
    # doesn't skip that one entry, it takes down the whole provisioning module — and Grafana's
    # HTTP server never starts until provisioning finishes — confirmed for real
    # (`org.notFound: failed to get org by ID: 2`) and against upstream issues describing the
    # same fail-fast validation (e.g. grafana/grafana#20502, #44243). Checked for an escape
    # hatch before deciding to remove this instead of trying to patch around it: the pinned
    # Grafana version here is 13.1.3 (kube-prometheus-stack 88.3.0's grafana subchart
    # appVersion) and its own provisioning docs document no "tolerate missing org" flag, and no
    # org-name-lookup alternative to numeric orgId for datasources (org_name exists for *plugin*
    # provisioning only, not datasources) — so there's no supported way to make this one entry
    # soft-fail. Since Grafana now has real persistent storage (this file's
    # `persistence.enabled: true` above), the org that used to get wiped on every restart
    # survives from then on — but the very first boot, before that org exists at all, would
    # still crash-loop forever if this ConfigMap were still here, since nothing could ever make
    # the HTTP API come up to run the bootstrap that creates the org in the first place.
    #
    # The fix is to stop provisioning this datasource statically at all: the same bootstrap
    # flow that creates org 2 (BOOTSTRAP.md step 5 / dev-env/start-environment.sh) must also
    # `POST /api/datasources` (Prometheus + Alertmanager, same fields as the removed ConfigMap
    # above) while authenticated into org 2, right after creating it. BOOTSTRAP.md step 5 has
    # been updated to do this by hand; dev-env/start-environment.sh's automated bootstrap needs
    # the equivalent follow-up call (out of scope for this repo — that script lives outside it).
    # If a future editor is tempted to re-add a static org-2 datasource ConfigMap: don't, for
    # exactly the reasons above — it will deadlock again the moment anyone tests a truly clean
    # first install.

    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: shophub-shops
        namespace: shophub
        # kube-prometheus-stack's Prometheus CR is rendered with
        # serviceMonitorSelector: {matchLabels: {release: shophub}} (from
        # serviceMonitorSelectorNilUsesHelmValues) rather than the chart's own documented "{}
        # selects everything" default — confirmed against the actual deployed Prometheus CR,
        # not just the chart's values.yaml. additionalPrometheusRulesMap-generated
        # PrometheusRules get this label automatically; a raw extraManifests object like this
        # one doesn't, so it has to be set explicitly or Prometheus silently never scrapes it.
        labels:
          release: shophub
      spec:
        namespaceSelector:
          matchNames:
            - shops
        selector:
          matchLabels:
            app.kubernetes.io/name: shophub-shop
        endpoints:
          - port: http
            path: /metrics
            interval: 30s

    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: shophub-app
        namespace: shophub
        labels:
          release: shophub
      spec:
        namespaceSelector:
          matchNames:
            - shophub
        selector:
          matchLabels:
            app.kubernetes.io/name: shophub
        endpoints:
          - port: http
            path: /metrics
            interval: 30s

    # Alert-to-Discord routing (one AlertmanagerConfig per DiscordChannel, matcher
    # `service=<DiscordChannel CR name>`, wired to that channel's own `<name>-discord-webhook`
    # Secret) is no longer hand-maintained here — shophub-shop-operator's
    # DiscordChannelReconciler generates it automatically for every DiscordChannel CR, shops and
    # the shophub-app platform channel alike, the moment its webhook exists. See that repo's
    # reconcileAlertmanagerConfig.

  # Alert rules are the mirror image of the routing above: these ARE genuinely N-shop-scalable
  # without enumeration, since Prometheus groups `by (service)` — a distinct alert fires per shop
  # automatically as new shops start getting scraped. Only the *routing* to Discord (above) needs
  # a per-shop object; these rules don't.
  additionalPrometheusRulesMap:
    shophub-shop-alerts:
      groups:
        - name: shophub-shop-alerts
          rules:
            - alert: ShopTargetDown
              # up{...} == 0 alone doesn't catch a fully-down shop: with zero ready pods, the
              # Service has no Endpoints, so the ServiceMonitor target disappears entirely
              # instead of reporting up=0 — Prometheus has nothing to scrape, not something
              # scraped-and-failing. Confirmed by actually scaling a shop to zero replicas and
              # watching its `up` series vanish from /api/v1/query rather than go to 0. This
              # uses kube-state-metrics' object-derived (not scrape-derived) replica status
              # instead, which reports 0 regardless of whether there's anything left to scrape.
              #
              # Excludes by deployment name rather than joining on kube_deployment_labels: this
              # chart's kube-state-metrics isn't configured with a label allowlist, so
              # kube_deployment_labels carries no label_* fields to join on (confirmed empty
              # against the real /metrics output) — shop-operator is the only other deployment
              # in this namespace, so naming it directly is simpler and equally correct.
              expr: |
                label_replace(
                  kube_deployment_status_replicas_available{namespace="shops", deployment!="shop-operator"},
                  "service", "$1", "deployment", "(.*)"
                ) == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Shop {{ $labels.service }} is unreachable"
                description: "Shop '{{ $labels.service }}' has had zero available replicas for 5 minutes."
            - alert: ShopHighErrorRate
              expr: |
                (
                  sum by (service) (increase({"http.server.request.duration_seconds_count", namespace="shops", "http.response.status_code"=~"5.."}[15m]))
                  /
                  sum by (service) (increase({"http.server.request.duration_seconds_count", namespace="shops"}[15m]))
                ) > 0.05
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Shop {{ $labels.service }} has an elevated error rate"
                description: "More than 5% of requests to shop '{{ $labels.service }}' returned a 5xx status over the last 15 minutes."
            - alert: ShopHighLatency
              expr: |
                histogram_quantile(0.95, sum by (service, le) (rate({"http.server.request.duration_seconds_bucket", namespace="shops"}[5m]))) > 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Shop {{ $labels.service }} has high request latency"
                description: "The 95th percentile request duration for shop '{{ $labels.service }}' has been above 1s for 10 minutes."
    # shophub-app's own alerting — routed to the static platform DiscordChannel CR (name
    # "shophub-app", see shop-operator/values.yaml's discord.platformChannelName), same
    # auto-generated-AlertmanagerConfig mechanism as every shop's own alerts.
    shophub-app-alerts:
      groups:
        - name: shophub-app-alerts
          rules:
            - alert: ShopHubAppTargetDown
              # Same "zero available replicas, not scrape-derived up==0" reasoning as
              # ShopTargetDown above. shophub is the only Deployment in this namespace (release
              # name "shophub" — see helm.yaml — makes shophub.fullname just "shophub"), so no
              # exclusion logic is needed. "service" is set to the literal "shophub-app" (not
              # derived from the deployment name) to match the platform DiscordChannel CR's own
              # name, which is what its auto-generated AlertmanagerConfig's matcher uses.
              expr: |
                label_replace(
                  kube_deployment_status_replicas_available{namespace="shophub", deployment="shophub"},
                  "service", "shophub-app", "namespace", "(.*)"
                ) == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "ShopHub platform is unreachable"
                description: "shophub-app has had zero available replicas for 5 minutes."
