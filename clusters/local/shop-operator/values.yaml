# Overrides on top of the chart's own defaults (image, resources, RBAC, CRD install — see
# shophub-helm-charts/charts/shop-operator/values.yaml for what those already are; no need to
# repeat them here).

discord:
  # secretNamespace/secretName/secretBotTokenKey/secretGuildIdKey are left at the chart's own
  # defaults ("shophub"/"shophub-discord"/DISCORD_BOT_TOKEN/DISCORD_GUILD_ID) — they already
  # match the shophub chart's own computed default Secret name given this cluster's release name
  # (see clusters/local/shophub/values.yaml's discord section, which is where the real bot
  # token/guild ID actually get configured now — this chart no longer owns that credential).
  # shophub-app's own platform-level alert channel — created in the default guild (no per-shop
  # onboarding needed for this one, there's only ever one).
  platformChannelName: shophub-app-alerts
