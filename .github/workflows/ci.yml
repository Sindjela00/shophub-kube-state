# CI pipeline — triggered on every PR against develop/master.
# TODO (tracked in the "Cluster state definitions" issue): once real chart refs/versions
# exist, validate each release with `helm template <chart>@<version> -f values.yaml` against
# the actual pinned chart — not just that the YAML parses.
name: CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" clusters/
